[project]
name = "sfx-gen-mcp"
version = "0.1.0"
description = "MCP server for local game sound-effect generation with Stable Audio Open"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jim Cline" }]
requires-python = ">=3.10"
keywords = ["mcp", "audio", "sound-effects", "gamedev", "stable-audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "mcp>=1.9",
    "stable-audio-tools>=0.0.19",
    "torch>=2.5",
    "torchaudio>=2.5",
    "numpy",
    "soundfile",
]

[project.scripts]
sfx-gen-mcp = "sfx_gen_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jimcline/sfx-gen-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfx_gen_mcp"]
